name: Feature Request
description: Describe a reading or editing task you want to complete.
title: '[Feature] '
body:
  - type: textarea
    id: goal
    attributes:
      label: What task do you want to complete?
      description: Describe a concrete use case.
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What gets in your way today?
      description: Include your current steps, affected formats or interface location.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your suggestion (optional)
      description: Interaction ideas, public examples and sketches are welcome.
