name: Bug Report
description: Report a problem with file reading, editing or the interface.
title: '[Bug] '
body:
  - type: input
    id: app-version
    attributes:
      label: Luma version
      placeholder: For example, 0.9.0 (build 16), or a source commit
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: For example, macOS 15.7
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Processor architecture
      options:
        - Apple Silicon (M series)
        - Intel
        - Unsure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For file-related problems, include the format, size and Preview / Source mode.
      placeholder: |
        1. Open...
        2. Click or type...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sample, screenshot or log (optional)
      description: Attach a minimal public example. Remove credentials, private paths and sensitive document content first.
